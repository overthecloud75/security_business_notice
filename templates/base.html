<!DOCTYPE html>
<html lang='ko'>
    <head>
        <meta charset='UTF-8'>
        <meta name='viewport' content='width=device-width, initial-scale=1.0'>
        <title>{% block title %}Seucrity Business Notice{% endblock %}</title>
        {% if nonce %}
        <meta 
            http-equiv='Content-Security-Policy' 
            content="script-src 'self' 'nonce-{{ nonce }}' code.jquery.com cdn.jsdelivr.net cdnjs.cloudflare.com;"
        >
        {% else %}
        <meta 
            http-equiv='Content-Security-Policy' 
            content="script-src 'self' code.jquery.com cdn.jsdelivr.net cdnjs.cloudflare.com;"
        >
        {% endif %}
        <!-- Bootstrap CSS -->
        <link 
            href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' 
            rel='stylesheet' 
            integrity='sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH' 
            crossorigin='anonymous'
        >
        <!-- JavaScript Bundle with Popper -->
        <script 
            src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js' integrity='sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz' 
            crossorigin='anonymous'
        >
        </script>
        <script
            src='https://code.jquery.com/jquery-3.7.1.min.js'
            integrity='sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo='
            crossorigin='anonymous'
        >
        </script>
        <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css'>
        <!-- custom CSS -->
        <link rel="stylesheet" href='/static/css/dashboard.css?v=20251123'>
    </head>
    <body>
        <!-- 기본 템플릿 안에 삽입될 내용 Start -->
        {% block content %}
        {% endblock %}
        <!-- 기본 템플릿 안에 삽입될 내용 End -->
    </body>
</html>
